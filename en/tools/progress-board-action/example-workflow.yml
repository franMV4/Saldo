# Copy to .github/workflows/board.yml in YOUR repo.
# Add a repository secret STRIPE_BOARD_KEY = a restricted key with only "Checkout Sessions: read".
name: Progress board
on:
  schedule:
    - cron: '17 * * * *'   # every hour
  workflow_dispatch:
permissions:
  contents: write          # needed to commit board.svg
jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: franMV4/Saldo/en/tools/progress-board-action@main
        with:
          stripe-key: ${{ secrets.STRIPE_BOARD_KEY }}
          links: plink_123 plink_456
          goal: 50
          unit: 100
          svg: board.svg
          readme: README.md
          title: My goal
